name: build

# PR と main: 作って確かめる。タグ vX.Y: 作って確かめて Releases に置く。
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # 元フォントの版上げ (source-bump.yml) が、sha256 を書き換えたコミットを確かめるときに呼ぶ。
  # 呼ぶ側は renovate/** への push だけで動くので、下の actions/cache が書くのはそのブランチの範囲のキャッシュ。
  # main の範囲で PR のコードを動かす起こし方 (workflow_dispatch など) から呼ばないこと (キャッシュ汚染になる)
  workflow_call:
    inputs:
      ref:
        description: 確かめるコミット
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # 呼ばれたときは渡されたコミット (無ければいつもどおり)
          ref: ${{ inputs.ref }}

      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+$' || { echo "タグは vX.Y: $GITHUB_REF_NAME"; exit 1; }
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # 道具は Rust の 1 本 (tools/)。版は rust-toolchain.toml と tools/Cargo.lock で固定。
      # rust-toolchain.toml の版 (1.x) の道具・依存の crate・作ったものを残しておく
      - uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.cargo/registry
            ~/.cargo/git
            tools/target
          key: cargo-${{ hashFiles('rust-toolchain.toml', 'tools/Cargo.lock') }}

      # 取ってくる元 (BIZ UDゴシック・denpa の表など)。fetch.sh は sha256 が合えば取り直さない
      - uses: actions/cache@v6
        with:
          path: build/src
          key: src-${{ hashFiles('fetch.sh') }}

      - name: 取得
        # 元フォント・denpa の表などを取ってきて確かめる (道具はネットに触らない)
        run: sh fetch.sh

      - name: 道具 (cargo test・build)
        run: |
          cargo test --release --locked --manifest-path tools/Cargo.toml
          cargo build --release --locked --manifest-path tools/Cargo.toml

      - name: フォント生成
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.v.outputs.epoch }}
        # 字ごとにランナーの CPU の数だけ並べて作る
        run: |
          tools/target/release/denpa-font build "$VERSION"
          (cd dist && sha256sum denpa-font.ttf denpa-font.woff2 denpa-font-jisx0213.woff2 denpa-font-jisx0213.txt > SHA256SUMS && cat SHA256SUMS)

      - name: Previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # denpa-font.ttf を持つ一番新しいリリース (いま作るタグは除く)
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName'); do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            if gh release view "$tag" --json assets -q '.assets[].name' | grep -qx denpa-font.ttf; then
              gh release download "$tag" -p denpa-font.ttf -O prev.ttf
              echo "PREV=$tag" >> "$GITHUB_ENV"
              break
            fi
          done

      - name: 確認 (と、同じ入力から同じバイト列になるかの 2 回目のビルド)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.v.outputs.epoch }}
        run: |
          set -o pipefail
          # 2 回目は別の所 (build/again) に作る。確かめている間に並べて回し、最後に比べる
          DENPA_OUT=build/again tools/target/release/denpa-font build "$VERSION" > build/again.log 2>&1 &
          again=$!
          # woff2 は Google の woff2_decompress で解いて ttf と比べる
          sudo apt-get install -y -qq woff2 > /dev/null
          for f in denpa-font denpa-font-jisx0213; do cp "dist/$f.woff2" "build/check-$f.woff2" && woff2_decompress "build/check-$f.woff2"; done
          tools/target/release/denpa-font verify dist/denpa-font.ttf ${PREV:+--prev prev.ttf} --woff2 build/check-denpa-font.ttf --woff2 build/check-denpa-font-jisx0213.ttf | tee verify.txt
          wait "$again" || { cat build/again.log; exit 1; }
          (cd build/again/dist && sha256sum -c ../../../dist/SHA256SUMS)
          {
            echo "Denpa Font ${GITHUB_REF_NAME}"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "確かめた結果 (前の版: ${PREV:-なし})"
            echo
            echo '```'
            cat verify.txt
            echo '```'
          } > notes.md
          cp notes.md "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: denpa-font
          path: |
            dist/
            notes.md

      - name: 前の版から変わった字の見本
        if: hashFiles('build/changes.svg') != ''
        uses: actions/upload-artifact@v7
        with:
          name: changes
          path: build/changes.svg

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: denpa-font
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            dist/denpa-font.ttf dist/denpa-font.woff2 dist/denpa-font-jisx0213.woff2 dist/denpa-font-jisx0213.txt dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
